name: Publish playable MyBlade to GitHub Pages
on:
  push:
    branches: [main, fix/playable-from-archive-20261111]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exactly one playable site
        run: |
          python3 scripts/prepare_game.py
          test -s game/index.html
          mkdir -p _site
          cp -a game/. _site/
          touch _site/.nojekyll
          echo "SITE_FILES: $(find _site -type f | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
