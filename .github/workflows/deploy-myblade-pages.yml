name: Publish playable MyBlade to GitHub Pages
on:
  push:
    branches: [main, fix/playable-from-archive-20261111]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'myblade-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build project-relative static Pages site
        run: |
          python3 scripts/build_static_site.py
          test -s _site/index.html
          test -s _site/__styles.css
          test ! -e _site/serve.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy static game
        id: deployment
        uses: actions/deploy-pages@v4
