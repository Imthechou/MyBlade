name: Publish MyBlade game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack standalone game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          if Path('game/index.html').exists():
              shutil.copytree('game', '_site', dirs_exist_ok=True)
              source = 'editable game/'
          else:
              with zipfile.ZipFile('锻刀大赛.zip') as z:
                  z.extractall('_unpacked')
              files=sorted(Path('_unpacked').rglob('index.html'),key=lambda p:len(p.parts))
              if not files: raise RuntimeError('Game index.html missing from ZIP')
              shutil.copytree(files[0].parent, '_site', dirs_exist_ok=True)
              source = str(files[0].parent)
          Path('_site/.nojekyll').touch()
          print('Prepared', len(list(Path('_site').rglob('*'))), 'items from', source)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy static game
        id: deployment
        uses: actions/deploy-pages@v4
