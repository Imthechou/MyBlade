name: Unpack editable MyBlade game
on:
  push:
    branches: [feat/forge-visual-interaction-v404-20261110]
permissions:
  contents: write
jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand source archive into editable game directory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tempfile import TemporaryDirectory
          import shutil
          src=Path("锻刀大赛.zip")
          if not src.exists():
              print("Already unpacked")
              raise SystemExit
          with TemporaryDirectory() as d:
              with ZipFile(src) as z:
                  names=z.namelist()
                  bad=[x for x in names if x.startswith('/') or '..' in Path(x).parts]
                  if bad: raise RuntimeError("Unsafe ZIP members")
                  z.extractall(d)
              indexes=list(Path(d).rglob("index.html"))
              if len(indexes)!=1: raise RuntimeError("Expected single index: "+str(indexes))
              shutil.copytree(indexes[0].parent, "game", dirs_exist_ok=True)
          print("Exported files",len(list(Path("game").rglob("*"))))
          print("Root:")
          for p in sorted(Path("game").iterdir()):
              print("ENTRY",p.name,"DIR" if p.is_dir() else p.stat().st_size)
          for p in sorted(Path("game").rglob("*")):
              if p.is_file() and (p.suffix in ('.js','.css','.html','.json','.ts','.tsx')):
                  print("SOURCE",str(p),p.stat().st_size)
          PY
      - name: Commit and publish editable source on feature branch
        shell: bash
        run: |
          if [ -d game ] && [ -f "锻刀大赛.zip" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm "锻刀大赛.zip"
            git add game
            git commit -m "chore: expand MyBlade 4.0.4 into editable game source"
            git push origin HEAD:feat/forge-visual-interaction-v404-20261110
          fi
