name: Export editable game source for local visual QA
on:
  push:
    branches: [feat/forge-visual-interaction-v404-20261110]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Bundle current game source
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          with ZipFile('myblade-editor-source.zip','w',ZIP_DEFLATED,compresslevel=4) as z:
              for p in Path('game').rglob('*'):
                  if p.is_file(): z.write(p)
          print('Source snapshot',Path('myblade-editor-source.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: myblade-editor-source
          path: myblade-editor-source.zip
