name: Restore MyBlade and real-browser playtest
on:
  push:
    branches: [main, fix/playable-from-archive-20261111, 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Restore editable game source
        run: python3 scripts/prepare_game.py
      - name: Validate syntax and static site packaging
        run: |
          test -s game/index.html
          for f in game/src/v19/forgeView.js game/src/v19/stage.js game/src/v19/materials.js game/src/app/bootstrap.js; do
            test ! -f "$f" || node --check "$f"
          done
          python3 scripts/build_static_site.py
          test -s _site/__styles.css
      - name: Run actual Node unit and syntax tests
        run: |
          cd game
          npm test
          npm run test:syntax
      - name: Commit restored sources, remove compressed duplicate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/
          for archive in *.zip; do
            if test -f "$archive"; then git rm -f -- "$archive"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore editable latest game and remove compressed duplicate"
            git push origin "HEAD:$GITHUB_REF_NAME" || echo "WARNING: push rejected, CI still has restored source"
          fi
      - name: Install real Chromium
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser UI playtest, mobile and desktop
        run: |
          node game/serve.cjs 4173 127.0.0.1 >/tmp/myblade-http.log 2>&1 &
          sleep 2
          timeout --signal=TERM --kill-after=10s 125s node qa/archive-playtest.cjs
      - name: Verify static GitHub Pages under /MyBlade/ subpath
        run: |
          mkdir -p pages-root
          ln -s ../_site pages-root/MyBlade
          python3 -m http.server 4174 --bind 127.0.0.1 --directory pages-root >/tmp/myblade-pages.log 2>&1 &
          sleep 2
          PLAYTEST_TARGET=pages PLAYTEST_BASE_URL=http://127.0.0.1:4174/MyBlade/ timeout --signal=TERM --kill-after=10s 125s node qa/archive-playtest.cjs
      - name: Real borrowed-blade tournament swipe and report
        if: success()
        run: timeout --signal=TERM --kill-after=10s 90s node qa/arena-playtest.cjs
      - name: Five-phase forging regression
        if: always()
        run: timeout --signal=TERM --kill-after=10s 155s node qa/forge-visual.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myblade-playtest-screenshots-and-results
          path: |
            audit-playtest/
            audit/
            audit-arena/
          if-no-files-found: ignore
