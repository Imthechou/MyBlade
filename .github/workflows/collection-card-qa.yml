name: MyBlade collection card QA

on:
  pull_request:
    paths:
      - 'game/src/ui/bladeCard*.js'
      - 'game/src/ui/pages/workshop.js'
      - 'game/src/v19/collectionThumb.js'
      - 'game/css/pages/workshop.css'
      - 'qa/collection-card.spec.cjs'
      - '.github/workflows/collection-card-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run core unit tests
        run: node --test game/tests/unit/*.test.mjs
      - name: Prepare Chrome and Chinese fonts
        run: |
          npm install --no-audit --no-fund --no-save --fetch-timeout=45000 --fetch-retries=1 playwright@1.56.1
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -n "$browser" ]]; then
            echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
          if [[ -z "$(fc-list ':lang=zh')" ]]; then
            fonts="$HOME/.local/share/fonts"
            mkdir -p "$fonts"
            curl --fail --silent --show-error --location --max-time 40 \
              https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
              -o "$fonts/NotoSansCJKsc-Regular.otf"
            curl --fail --silent --show-error --location --max-time 40 \
              https://raw.githubusercontent.com/notofonts/noto-cjk/Serif2.003/Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Regular.otf \
              -o "$fonts/NotoSerifCJKsc-Regular.otf"
            fc-cache -f "$fonts"
          fi
      - name: Verify collection cards in the static build
        run: |
          python3 scripts/build_static_site.py
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/myblade-collection-server.log 2>&1 &
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ > /dev/null
          node qa/collection-card.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myblade-collection-qa
          path: audit/collection/
          if-no-files-found: warn
